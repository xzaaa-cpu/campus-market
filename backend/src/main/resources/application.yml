server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-market
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/campus_market;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
    banner: false

app:
  jwt:
    secret: campus-market-secret-key-2026-please-change-in-production-0123456789
    expire-hours: 72

logging:
  level:
    com.campus.market: info
